# libcint built from source with the 4-center 1-electron overlap
# integrals (cint4c1e_*) enabled. conda-forge's libcint package is built
# without WITH_4C1E, so SlaterGPU builds its own copy here and lists it in
# both host- and run-dependencies (see ../../pixi.toml).
#
# The other -DWITH_* flags mirror the conda-forge feedstock's build.sh so we
# don't lose integrals that the conda-forge package provides:
# https://github.com/conda-forge/libcint-feedstock/blob/main/recipe/build.sh
#
# Source: upstream v6.2.1 plus one commit fixing a heap overflow in the 4c1e
# cache size (#82), on the fix-4c1e-cache-size branch of the ZimmermanGroup
# fork. pixi-build can't apply patch files to a git source yet
# (https://github.com/prefix-dev/pixi/issues/6918), so the fix lives on that
# branch. Once it's merged upstream, point this back at sunqm/libcint by tag.

[package]
name = "libcint"
version = "6.2.1"

[package.build.backend]
name = "pixi-build-cmake"
# Same cap as SlaterGPU's own backend (#105)
version = ">=0.3.6,<=0.3.11"

[package.build.source]
git = "https://github.com/ZimmermanGroup/libcint.git"
rev = "2f9146fa1fb33bdeeb9d3bca7dbc28a8b208f1b0"

[package.build.config]
compilers = ["c"]
extra-args = [
    "-DCMAKE_BUILD_TYPE=Release",
    "-DCMAKE_INSTALL_LIBDIR=lib",
    "-DBUILD_SHARED_LIBS=ON",
    "-DWITH_4C1E=ON",
    "-DWITH_F12=ON",
    "-DWITH_RANGE_COULOMB=ON",
    "-DWITH_COULOMB_ERF=ON",
]
